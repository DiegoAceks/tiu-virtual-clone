<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TIU Virtual (clon de demostración)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <button class="back" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="28" height="28"><path d="M15 4 7 12l8 8" fill="none" stroke="#d3122a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>TIU VIRTUAL</h1>
    </header>

    <section class="clock-block">
      <div class="clock" id="clock" aria-live="off">00:00:00</div>
      <p class="date" id="date"></p>
    </section>

    <section class="scene">
      <svg class="cloud c1" viewBox="0 0 60 30"><path d="M5 28a9 9 0 0 1 6-16 12 12 0 0 1 23-3 10 10 0 0 1 21 8 6 6 0 0 1-2 11z"/></svg>
      <svg class="cloud c2" viewBox="0 0 60 30"><path d="M5 28a9 9 0 0 1 6-16 12 12 0 0 1 23-3 10 10 0 0 1 21 8 6 6 0 0 1-2 11z"/></svg>
      <svg class="cloud c3" viewBox="0 0 60 30"><path d="M5 28a9 9 0 0 1 6-16 12 12 0 0 1 23-3 10 10 0 0 1 21 8 6 6 0 0 1-2 11z"/></svg>

      <div class="avatar">
        <svg viewBox="0 0 200 200" aria-label="Foto de perfil">
          <defs><clipPath id="clip"><circle cx="100" cy="100" r="100"/></clipPath></defs>
          <g clip-path="url(#clip)">
            <rect width="200" height="200" fill="#f4f4f4"/>
            <path d="M20 200c4-34 30-44 60-52l20 14 20-14c30 8 56 18 60 52z" fill="#9b9b9b"/>
            <path d="M78 140h44v22l-22 8-22-8z" fill="#c4c4c4"/>
            <ellipse cx="100" cy="92" rx="30" ry="38" fill="#dedede"/>
            <path d="M68 90c-8-30 2-56 32-58 20-2 34 10 36 34l-2 24-6-24c-14-4-34-8-48-4z" fill="#8f8f8f"/>
          </g>
        </svg>
      </div>

      <div class="skyline" aria-hidden="true"></div>

      <article class="card">
        <h2 id="nombre"></h2>
        <p class="label">Código de alumno:</p>
        <p class="value" id="codigo"></p>
        <p class="label">ID Banner:</p>
        <p class="value" id="banner"></p>
        <p class="career" id="carrera"></p>
        <p class="campus">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#d3122a"/></svg>
          <span id="campus"></span>
        </p>
      </article>
    </section>

    <p class="disclaimer">Clon de demostración con datos de ejemplo. No es un documento de identificación.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
